[app]
project_name = ForkFolio
project_description = Recipe management API
version = 0.1.0

[api]
base_path = /api/v1
rate_limit_per_minute = 120
max_request_size_mb = 1
request_timeout_seconds = 120.0

[database]
host = aws-0-us-west-2.pooler.supabase.com
user = postgres.ekbxhveywkqxuimnaflu
name = postgres
port = 5432
sslmode = require
pool_minconn = 2
pool_maxconn = 10

[llm]
model_name = openai/gpt-oss-20b
max_retries = 3
retry_base_seconds = 1.0
retry_max_seconds = 10.0
structured_max_tokens = 3500
structured_output_max_attempts = 2
recipe_unit_system = us

[embeddings]
model_name = baai/bge-base-en-v1.5

[dedupe]
embedding_type = title_ingredients
strict_duplicate_threshold = 0.05
distance_threshold = 0.30

[search]
hybrid_v2_max_distance = 0.32
hybrid_v2_min_score = 0.1
hybrid_v2_trigram_threshold = 0.18
hybrid_v2_fts_weight = 0.45
hybrid_v2_trigram_weight = 0.2
hybrid_v2_vector_weight = 0.35

[observability]
braintrust_enabled = false
braintrust_project_id = 4e61341a-cc9a-4ce4-a107-4f9980e76b1a
braintrust_app_url = https://www.braintrust.dev
